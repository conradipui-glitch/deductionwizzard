[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "historicdeductionsim"
version = "0.1.0"
description = "Source-first research casebooks, evidence timelines and hypothesis comparison"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
